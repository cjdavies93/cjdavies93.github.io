<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Language Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* Swap these variables to match sentencebuilder exactly */
  :root {
    --bg: #fdf6ee;
    --ink: #4a4458;
    --pink: #f9c9d4;
    --blue: #bfe0f5;
    --green: #c9ecd0;
    --yellow: #fdeab0;
    --heading-font: "Fredoka", "Nunito", "Comic Sans MS", system-ui, sans-serif;
    --body-font: "Nunito", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body-font);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 20px;
  }
  h1 {
    font-family: var(--heading-font);
    font-weight: 600;
    font-size: clamp(2rem, 6vw, 3.4rem);
    margin: 0 0 36px;
    text-align: center;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    width: min(560px, 100%);
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 120px;
    padding: 16px;
    border-radius: 24px;
    border: 3px solid var(--ink);
    box-shadow: 0 6px 0 var(--ink);
    color: var(--ink);
    text-decoration: none;
    font-family: var(--heading-font);
    font-weight: 500;
    font-size: clamp(1.1rem, 3.5vw, 1.5rem);
    text-align: center;
    transition: transform .12s, box-shadow .12s;
  }
  .btn:hover, .btn:focus-visible { transform: translateY(3px); box-shadow: 0 3px 0 var(--ink); outline: none; }
  .btn:active { transform: translateY(6px); box-shadow: 0 0 0 var(--ink); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  .pink { background: var(--pink); }
  .blue { background: var(--blue); }
  .green { background: var(--green); }
  .yellow { background: var(--yellow); }
  @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
  <h1>English Language Games</h1>
  <nav class="grid">
    <a class="btn pink" href="https://viewer.clives.online/randomsentence">Random Sentence</a>
    <a class="btn blue" href="https://viewer.clives.online/sentencebuilder">Sentence Builder</a>
    <a class="btn green" href="https://viewer.clives.online/sentencestress">Sentence Stress</a>
    <a class="btn yellow" href="https://viewer.clives.online/wordoftheday">Word of the Day</a>
  </nav>
</body>
</html>
