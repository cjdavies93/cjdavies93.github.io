<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word of the Day</title>
<style>
  :root {
    --bg: #c9d9f7;
    --panel: #ffffff;
    --ink: #1c2540;
    --muted: #5d6783;
    --accent: #2c55e0;
    --accent-dark: #1b3bb0;
    --line: #c3cbdb;
    --error: #b3261e;
    --font: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  main {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 32px 28px 28px;
  }
  header { margin-bottom: 6px; }
  h1 { margin: 0 0 24px; font-size: 1.6rem; letter-spacing: -0.01em; }

  #status {
    display: none;
    margin-bottom: 16px;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.4;
  }
  #status.visible { display: block; }
  #status.error { border-color: var(--error); color: var(--error); }

  .card { display: none; }
  .field {
    --t: #f9c6d9;
    background: var(--t);
    border-radius: 8px;
    padding: 12px 16px 14px;
    margin-bottom: 12px;
  }
  .field-label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }
  .field-label { font-size: 0.85rem; font-weight: 600; color: var(--muted); }
  .field-value {
    font-size: 1.05rem;
    line-height: 1.45;
    color: var(--ink);
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .field:first-child .field-value {
    font-size: clamp(1.6rem, 8vw, 2.1rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.15;
  }
  .field-value:empty::after { content: "\2014"; color: var(--muted); }

  button {
    font: inherit;
    font-weight: 600;
    border: 0;
    border-radius: 8px;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover:not(:disabled) { filter: brightness(0.94); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible, select:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .speak-btn {
    font-size: 0.85rem;
    padding: 6px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    white-space: nowrap;
  }
  .speak-btn.speaking { background: var(--accent); border-color: var(--accent); color: #fff; }

  .selector-row {
    display: grid;
    grid-template-columns: auto 1fr 44px 44px;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
  }
  .selector-row label { font-weight: 600; color: var(--muted); }
  #recordSelect {
    font: inherit;
    font-size: 1.05rem;
    min-width: 0;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: var(--ink);
  }
  .nav-btn {
    background: #b6e6ea;
    padding: 12px 0;
    font-size: 1rem;
    line-height: 1;
  }

  .empty-state {
    text-align: center;
    padding: 24px 16px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  @media (max-width: 420px) {
    main { padding: 24px 18px; }
    .selector-row { gap: 8px; grid-template-columns: auto 1fr 40px 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Word of the Day</h1>
  </header>

  <div id="status"></div>

  <div class="card" id="card"></div>

  <div class="selector-row" id="selectorRow" style="display:none;">
    <label for="recordSelect" id="selectLabel">Select</label>
    <select id="recordSelect"></select>
    <button class="nav-btn" id="prevBtn" title="Previous record" aria-label="Previous record">&#8592;</button>
    <button class="nav-btn" id="nextBtn" title="Next record" aria-label="Next record">&#8594;</button>
  </div>

  <div class="empty-state" id="emptyState">Loading records.json…</div>
</main>

<script>
(function () {
  const statusBox     = document.getElementById('status');
  const emptyState    = document.getElementById('emptyState');
  const selectorRow   = document.getElementById('selectorRow');
  const selectLabel   = document.getElementById('selectLabel');
  const recordSelect  = document.getElementById('recordSelect');
  const prevBtn       = document.getElementById('prevBtn');
  const nextBtn       = document.getElementById('nextBtn');
  const card          = document.getElementById('card');

  let records = [];   // full parsed data
  let fields  = [];   // detected field names, in order

  // Pastel background per field (same palette as the Sentence Builder buttons), cycling if needed.
  const PALETTE = [
    '#f9c6d9', // pastel pink
    '#fdd3b0', // pastel peach
    '#fcefa0', // pastel yellow
    '#bfead0', // pastel mint
    '#b6e6ea', // pastel aqua
    '#dcc9f3'  // pastel lavender
  ];

  function showStatus(message, isError) {
    statusBox.textContent = message;
    statusBox.className = 'visible' + (isError ? ' error' : '');
  }

  function hideStatus() {
    statusBox.className = '';
  }

  const DATA_URL = 'records.json';

  // TEMPORARY sample data for checking the layout.
  const SAMPLE_DATA = [
    { "Word": "Serendipity", "Part of speech": "noun", "Meaning": "Finding something good or valuable by chance, when you were not looking for it.", "Example sentence": "Meeting my best friend on a delayed train was pure serendipity.", "Origin": "Coined by Horace Walpole in 1754, inspired by the Persian fairy tale The Three Princes of Serendip." },
    { "Word": "Petrichor", "Part of speech": "noun", "Meaning": "The pleasant, earthy smell that comes after rain falls on dry ground.", "Example sentence": "We opened the windows to enjoy the petrichor after the summer storm.", "Origin": "From Greek petra (stone) and ichor (the fluid in the veins of the gods)." },
    { "Word": "Ephemeral", "Part of speech": "adjective", "Meaning": "Lasting for a very short time.", "Example sentence": "The beauty of the cherry blossom is ephemeral, which is part of its charm.", "Origin": "" }
  ];

  function init() {
    hideStatus();
    showStatus('Loading records.json…', false);
    fetch(DATA_URL, { cache: 'no-store' })
      .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
        return res.json();
      })
      .then(data => {
        hideStatus();
        loadRecords(data);
      })
      .catch(err => {
        // TEMPORARY: fall back to sample data so the layout can be previewed.
        // Delete this block (and SAMPLE_DATA) once records.json is in place.
        console.warn('Could not load ' + DATA_URL + ': ' + err.message);
        loadRecords(SAMPLE_DATA);
        showStatus('Preview mode: ' + DATA_URL + ' not found, showing sample data.', false);
      });
  }

  function loadRecords(data) {
    // Accept either a bare array, or an object wrapping an array
    // (e.g. { records: [...] } / { data: [...] }).
    let arr = data;
    if (!Array.isArray(arr) && arr && typeof arr === 'object') {
      const key = Object.keys(arr).find(k => Array.isArray(arr[k]));
      if (key) arr = arr[key];
    }

    if (!Array.isArray(arr)) {
      showStatus('Expected the JSON to contain an array of records.', true);
      resetView();
      return;
    }
    if (arr.length === 0) {
      showStatus('The file contains an empty array — nothing to display.', true);
      resetView();
      return;
    }
    if (typeof arr[0] !== 'object' || arr[0] === null || Array.isArray(arr[0])) {
      showStatus('Expected each record to be a JSON object with text fields.', true);
      resetView();
      return;
    }

    fields = Object.keys(arr[0]);
    records = arr.map(r => {
      const clean = {};
      fields.forEach(f => {
        const v = (r && f in r) ? r[f] : '';
        clean[f] = (v === null || v === undefined) ? '' : String(v);
      });
      return clean;
    });

    buildSelector();
    showRecord(0);
    selectorRow.style.display = 'grid';
    card.style.display = 'block';
    emptyState.style.display = 'none';
  }

  function resetView() {
    records = [];
    fields = [];
    card.style.display = 'none';
    card.innerHTML = '';
    selectorRow.style.display = 'none';
    recordSelect.innerHTML = '';
    emptyState.textContent = 'records.json is not currently loaded.';
    emptyState.style.display = 'block';
  }

  function buildSelector() {
    const firstField = fields[0];
    selectLabel.textContent = firstField;
    recordSelect.innerHTML = '';
    records.forEach((record, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      const label = record[firstField].trim();
      opt.textContent = label ? label : '(untitled record ' + (i + 1) + ')';
      recordSelect.appendChild(opt);
    });
  }

  function showRecord(index) {
    if (canSpeak) window.speechSynthesis.cancel();
    const record = records[index];
    recordSelect.value = index;
    card.innerHTML = '';
    fields.forEach((field, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'field';
      wrap.style.setProperty('--t', PALETTE[i % PALETTE.length]);

      const labelRow = document.createElement('div');
      labelRow.className = 'field-label-row';

      const label = document.createElement('div');
      label.className = 'field-label';
      label.textContent = field;
      labelRow.appendChild(label);

      if (field.toLowerCase().includes('sentence')) {
        const speakBtn = document.createElement('button');
        speakBtn.className = 'speak-btn';
        speakBtn.type = 'button';
        speakBtn.textContent = '\u{1F50A} Listen';
        speakBtn.addEventListener('click', () => speakText(record[field], speakBtn));
        labelRow.appendChild(speakBtn);
      }

      const value = document.createElement('div');
      value.className = 'field-value';
      value.textContent = record[field];

      wrap.appendChild(labelRow);
      wrap.appendChild(value);
      card.appendChild(wrap);
    });

    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === records.length - 1;
  }

  const canSpeak = 'speechSynthesis' in window;

  function speakText(text, btn) {
    if (!canSpeak) {
      showStatus('Text-to-speech is not supported in this browser.', true);
      return;
    }
    if (!text || !text.trim()) return;

    // Toggle off if this button is already speaking.
    if (btn.classList.contains('speaking')) {
      window.speechSynthesis.cancel();
      return;
    }

    window.speechSynthesis.cancel(); // stop anything else in progress
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.onstart = () => btn.classList.add('speaking');
    utterance.onend = () => btn.classList.remove('speaking');
    utterance.onerror = () => btn.classList.remove('speaking');
    window.speechSynthesis.speak(utterance);
  }

  recordSelect.addEventListener('change', function () {
    showRecord(Number(recordSelect.value));
  });

  prevBtn.addEventListener('click', function () {
    const i = Number(recordSelect.value);
    if (i > 0) showRecord(i - 1);
  });

  nextBtn.addEventListener('click', function () {
    const i = Number(recordSelect.value);
    if (i < records.length - 1) showRecord(i + 1);
  });

  init();
})();
</script>
</body>
</html>
