<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clive's Word of the Day</title>
<style>
  :root{
    --ink:#1b1740;
    --bg1:#f4f0ff;
    --bg2:#fff3df;
    --sun:#ffd23f;
    --line:#e3def5;
    --accent:#6d28d9;
    --accent-soft:#efe9ff;
    --muted:#6b6590;
    --font: "Avenir Next", "Nunito", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html{min-height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%) fixed;
    color:var(--ink);
    font-family:var(--font);
    padding:2.5rem 1.25rem 4rem;
  }
  .wrap{max-width:720px;margin:0 auto;}

  header{
    margin-bottom:1.75rem;
    text-align:center;
  }
  h1{
    font-size:clamp(2rem,6vw,3.1rem);
    font-weight:900;
    margin:0;
    line-height:1.05;
    letter-spacing:-0.01em;
    color:#4c1d95;
    text-shadow:3px 3px 0 var(--sun);
  }

  #status{
    font-size:0.95rem;
    font-weight:700;
    padding:0.9rem 1rem;
    border:2px dashed #a78bfa;
    border-radius:12px;
    color:var(--ink);
    margin-bottom:1rem;
    display:none;
  }
  #status.error{
    border-color:#ff8a8a;
    background:#7a1d2b;
    color:#fff;
  }
  #status.visible{display:block;}

  .selector-row{
    display:flex;
    align-items:center;
    gap:0.6rem;
    margin-bottom:1.5rem;
  }
  .selector-row label{
    font-size:1rem;
    font-weight:800;
    color:#4c1d95;
    white-space:nowrap;
  }
  #recordSelect{
    flex:1;
    min-width:0;
    font-family:var(--font);
    font-size:1.1rem;
    font-weight:700;
    padding:0.7rem 0.9rem;
    border:3px solid #7c3aed;
    border-radius:12px;
    background:#fff;
    color:var(--ink);
  }
  #recordSelect:focus-visible,
  .nav-btn:focus-visible,
  .speak-btn:focus-visible{outline:3px solid #f59e0b;outline-offset:2px;}

  .nav-btn{
    font-family:var(--font);
    font-size:1.2rem;
    font-weight:900;
    line-height:1;
    background:#7c3aed;
    color:#fff;
    border:none;
    border-radius:12px;
    padding:0.7rem 0.95rem;
    cursor:pointer;
    box-shadow:0 3px 0 #4c1d95;
  }
  .nav-btn:hover:not(:disabled){background:#6d28d9;}
  .nav-btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #4c1d95;}
  .nav-btn:disabled{opacity:0.4;cursor:default;}

  .card{
    display:none;
    border-radius:20px;
    overflow:hidden;
    background:#fff;
    box-shadow:0 6px 0 #d9ccf5, 0 14px 30px rgba(76,29,149,0.12);
  }
  .field{
    --c:#6d28d9;
    --t:#efe9ff;
    padding:1.2rem 1.5rem 1.35rem;
    background:var(--t);
    border-left:12px solid var(--c);
    border-bottom:3px solid #fff;
  }
  .field:last-child{border-bottom:none;}
  .field-label-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:0.5rem;
    margin-bottom:0.55rem;
  }
  .field-label{
    display:inline-block;
    font-size:0.9rem;
    font-weight:800;
    text-transform:capitalize;
    letter-spacing:0.02em;
    color:#fff;
    background:var(--c);
    padding:0.3rem 0.8rem;
    border-radius:999px;
  }
  .speak-btn{
    font-family:var(--font);
    font-size:0.85rem;
    font-weight:800;
    line-height:1;
    background:#fff;
    color:var(--c);
    border:2px solid var(--c);
    border-radius:999px;
    padding:0.4rem 0.85rem;
    cursor:pointer;
    white-space:nowrap;
  }
  .speak-btn:hover,
  .speak-btn.speaking{background:var(--c);color:#fff;}
  .speak-btn:disabled{opacity:0.4;cursor:default;}
  .field-value{
    font-size:1.3rem;
    font-weight:700;
    line-height:1.45;
    color:var(--ink);
    word-wrap:break-word;
    white-space:pre-wrap;
  }
  /* The first field (the word itself) is the star of the page */
  .field:first-child .field-value{
    font-size:clamp(2rem,7vw,3rem);
    font-weight:900;
    line-height:1.1;
    color:var(--c);
  }
  .field-value:empty::after{
    content:"—";
    color:var(--muted);
  }

  .empty-state{
    text-align:center;
    padding:3rem 1rem;
    color:var(--ink);
    font-weight:700;
    font-size:1rem;
    border:2px dashed #a78bfa;
    border-radius:16px;
  }

  @media (max-width:480px){
    .field{padding:1rem 1rem 1.15rem;border-left-width:8px;}
    .field-value{font-size:1.15rem;}
    .selector-row label{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Clive's Word of the Day</h1>
  </header>

  <div id="status"></div>

  <div class="selector-row" id="selectorRow" style="display:none;">
    <label for="recordSelect" id="selectLabel">Select</label>
    <select id="recordSelect"></select>
    <button class="nav-btn" id="prevBtn" title="Previous record" aria-label="Previous record">&#8592;</button>
    <button class="nav-btn" id="nextBtn" title="Next record" aria-label="Next record">&#8594;</button>
  </div>

  <div class="card" id="card"></div>

  <div class="empty-state" id="emptyState">Loading records.json…</div>
</div>

<script>
(function () {
  const statusBox     = document.getElementById('status');
  const emptyState    = document.getElementById('emptyState');
  const selectorRow   = document.getElementById('selectorRow');
  const selectLabel   = document.getElementById('selectLabel');
  const recordSelect  = document.getElementById('recordSelect');
  const prevBtn       = document.getElementById('prevBtn');
  const nextBtn       = document.getElementById('nextBtn');
  const card          = document.getElementById('card');

  let records = [];   // full parsed data
  let fields  = [];   // detected field names, in order

  // One colour pair (strong / tint) per field, cycling if there are more fields than colours.
  const PALETTE = [
    { c: '#6d28d9', t: '#efe9ff' }, // violet
    { c: '#0f766e', t: '#dcf5f1' }, // teal
    { c: '#c2410c', t: '#ffe8da' }, // orange
    { c: '#1d4ed8', t: '#e0eaff' }, // blue
    { c: '#be123c', t: '#ffe0e8' }, // rose
    { c: '#4d7c0f', t: '#e8f5d0' }  // green
  ];

  function showStatus(message, isError) {
    statusBox.textContent = message;
    statusBox.className = 'visible' + (isError ? ' error' : '');
  }

  function hideStatus() {
    statusBox.className = '';
  }

  const DATA_URL = 'records.json';

  // TEMPORARY sample data for checking the layout.
  const SAMPLE_DATA = [
    { "Word": "Serendipity", "Part of speech": "noun", "Meaning": "Finding something good or valuable by chance, when you were not looking for it.", "Example sentence": "Meeting my best friend on a delayed train was pure serendipity.", "Origin": "Coined by Horace Walpole in 1754, inspired by the Persian fairy tale The Three Princes of Serendip." },
    { "Word": "Petrichor", "Part of speech": "noun", "Meaning": "The pleasant, earthy smell that comes after rain falls on dry ground.", "Example sentence": "We opened the windows to enjoy the petrichor after the summer storm.", "Origin": "From Greek petra (stone) and ichor (the fluid in the veins of the gods)." },
    { "Word": "Ephemeral", "Part of speech": "adjective", "Meaning": "Lasting for a very short time.", "Example sentence": "The beauty of the cherry blossom is ephemeral, which is part of its charm.", "Origin": "" }
  ];

  function init() {
    hideStatus();
    showStatus('Loading records.json…', false);
    fetch(DATA_URL, { cache: 'no-store' })
      .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
        return res.json();
      })
      .then(data => {
        hideStatus();
        loadRecords(data);
      })
      .catch(err => {
        // TEMPORARY: fall back to sample data so the layout can be previewed.
        // Delete this block (and SAMPLE_DATA) once records.json is in place.
        console.warn('Could not load ' + DATA_URL + ': ' + err.message);
        loadRecords(SAMPLE_DATA);
        showStatus('Preview mode: ' + DATA_URL + ' not found, showing sample data.', false);
      });
  }

  function loadRecords(data) {
    // Accept either a bare array, or an object wrapping an array
    // (e.g. { records: [...] } / { data: [...] }).
    let arr = data;
    if (!Array.isArray(arr) && arr && typeof arr === 'object') {
      const key = Object.keys(arr).find(k => Array.isArray(arr[k]));
      if (key) arr = arr[key];
    }

    if (!Array.isArray(arr)) {
      showStatus('Expected the JSON to contain an array of records.', true);
      resetView();
      return;
    }
    if (arr.length === 0) {
      showStatus('The file contains an empty array — nothing to display.', true);
      resetView();
      return;
    }
    if (typeof arr[0] !== 'object' || arr[0] === null || Array.isArray(arr[0])) {
      showStatus('Expected each record to be a JSON object with text fields.', true);
      resetView();
      return;
    }

    fields = Object.keys(arr[0]);
    records = arr.map(r => {
      const clean = {};
      fields.forEach(f => {
        const v = (r && f in r) ? r[f] : '';
        clean[f] = (v === null || v === undefined) ? '' : String(v);
      });
      return clean;
    });

    buildSelector();
    showRecord(0);
    selectorRow.style.display = 'flex';
    card.style.display = 'block';
    emptyState.style.display = 'none';
  }

  function resetView() {
    records = [];
    fields = [];
    card.style.display = 'none';
    card.innerHTML = '';
    selectorRow.style.display = 'none';
    recordSelect.innerHTML = '';
    emptyState.textContent = 'records.json is not currently loaded.';
    emptyState.style.display = 'block';
  }

  function buildSelector() {
    const firstField = fields[0];
    selectLabel.textContent = firstField;
    recordSelect.innerHTML = '';
    records.forEach((record, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      const label = record[firstField].trim();
      opt.textContent = label ? label : '(untitled record ' + (i + 1) + ')';
      recordSelect.appendChild(opt);
    });
  }

  function showRecord(index) {
    if (canSpeak) window.speechSynthesis.cancel();
    const record = records[index];
    recordSelect.value = index;
    card.innerHTML = '';
    fields.forEach((field, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'field';
      const colour = PALETTE[i % PALETTE.length];
      wrap.style.setProperty('--c', colour.c);
      wrap.style.setProperty('--t', colour.t);

      const labelRow = document.createElement('div');
      labelRow.className = 'field-label-row';

      const label = document.createElement('div');
      label.className = 'field-label';
      label.textContent = field;
      labelRow.appendChild(label);

      if (field.toLowerCase().includes('sentence')) {
        const speakBtn = document.createElement('button');
        speakBtn.className = 'speak-btn';
        speakBtn.type = 'button';
        speakBtn.textContent = '\u{1F50A} Listen';
        speakBtn.addEventListener('click', () => speakText(record[field], speakBtn));
        labelRow.appendChild(speakBtn);
      }

      const value = document.createElement('div');
      value.className = 'field-value';
      value.textContent = record[field];

      wrap.appendChild(labelRow);
      wrap.appendChild(value);
      card.appendChild(wrap);
    });

    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === records.length - 1;
  }

  const canSpeak = 'speechSynthesis' in window;

  function speakText(text, btn) {
    if (!canSpeak) {
      showStatus('Text-to-speech is not supported in this browser.', true);
      return;
    }
    if (!text || !text.trim()) return;

    // Toggle off if this button is already speaking.
    if (btn.classList.contains('speaking')) {
      window.speechSynthesis.cancel();
      return;
    }

    window.speechSynthesis.cancel(); // stop anything else in progress
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.onstart = () => btn.classList.add('speaking');
    utterance.onend = () => btn.classList.remove('speaking');
    utterance.onerror = () => btn.classList.remove('speaking');
    window.speechSynthesis.speak(utterance);
  }

  recordSelect.addEventListener('change', function () {
    showRecord(Number(recordSelect.value));
  });

  prevBtn.addEventListener('click', function () {
    const i = Number(recordSelect.value);
    if (i > 0) showRecord(i - 1);
  });

  nextBtn.addEventListener('click', function () {
    const i = Number(recordSelect.value);
    if (i < records.length - 1) showRecord(i + 1);
  });

  init();
})();
</script>
</body>
</html>
